<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradMaking" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2b0b14"/>
      <stop offset="50%" stop-color="#3d101d"/>
      <stop offset="100%" stop-color="#19040a"/>
    </linearGradient>
    <linearGradient id="goldShimmerMaking" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff4d0"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8a6b18"/>
    </linearGradient>
    <linearGradient id="rubyGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4b72"/>
      <stop offset="100%" stop-color="#990024"/>
    </linearGradient>
    <linearGradient id="anvilGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a4d46"/>
      <stop offset="100%" stop-color="#2a221e"/>
    </linearGradient>
    <filter id="glowMaking" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes hammerTap {
      0%, 100% { transform: rotate(0deg); }
      35% { transform: rotate(-35deg); }
      50% { transform: rotate(10deg); }
      60% { transform: rotate(-8deg); }
      75% { transform: rotate(0deg); }
    }
    @keyframes sparkBurst {
      0%, 45% { opacity: 0; transform: scale(0.2); }
      50% { opacity: 1; transform: scale(1.4); }
      70% { opacity: 0; transform: scale(1.8) translateY(-8px); }
      100% { opacity: 0; }
    }
    @keyframes gemGlowAnim {
      0%, 100% { filter: drop-shadow(0 0 3px #ff4b72); }
      50% { filter: drop-shadow(0 0 12px #ff4b72); }
    }
    @keyframes sparkleFloatMaking {
      0% { transform: translateY(0) scale(0.6); opacity: 0.2; }
      50% { transform: translateY(-8px) scale(1.2); opacity: 1; }
      100% { transform: translateY(-16px) scale(0.6); opacity: 0.2; }
    }
    .hammerGroup {
      transform-origin: 180px 70px;
      animation: hammerTap 2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .sparkCluster {
      animation: sparkBurst 2s infinite;
      transform-origin: 140px 115px;
    }
    .gemGroup {
      animation: gemGlowAnim 2s ease-in-out infinite;
    }
    .s1 { animation: sparkleFloatMaking 2.5s infinite; transform-origin: 50px 45px; }
    .s2 { animation: sparkleFloatMaking 3s infinite 0.8s; transform-origin: 275px 50px; }
    .s3 { animation: sparkleFloatMaking 2.2s infinite 1.2s; transform-origin: 260px 145px; }
    .s4 { animation: sparkleFloatMaking 2.7s infinite 0.4s; transform-origin: 55px 140px; }
  </style>

  <!-- Background Canvas -->
  <rect width="320" height="200" rx="12" fill="url(#bgGradMaking)" stroke="#d4af37" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Glowing Workbench Surface -->
  <ellipse cx="160" cy="145" rx="100" ry="24" fill="#3a121c" stroke="#d4af37" stroke-width="1" opacity="0.6"/>
  <rect x="70" y="145" width="180" height="15" rx="3" fill="url(#anvilGrad)" opacity="0.8"/>

  <!-- Traditional Goldsmith Anvil Block -->
  <g transform="translate(105, 105)">
    <path d="M 15 28 L 95 28 L 85 45 L 25 45 Z" fill="url(#anvilGrad)" stroke="#6a5d56" stroke-width="1"/>
    <!-- Anvil Horn & Top Flat -->
    <path d="M 5 12 L 105 12 C 105 12 110 16 100 24 L 10 24 C 0 18 5 12 5 12 Z" fill="#7a6c65" stroke="#9a8c85" stroke-width="1"/>
    <!-- Highlight -->
    <line x1="12" y1="14" x2="98" y2="14" stroke="#d4c8b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Handcrafted Maharashtrian Filigree Saaj Piece -->
  <g transform="translate(125, 108)">
    <path d="M 0 10 Q 35 25 70 10" fill="none" stroke="url(#goldShimmerMaking)" stroke-width="4" stroke-linecap="round"/>
    <circle cx="12" cy="13" r="3.5" fill="url(#goldShimmerMaking)"/>
    <circle cx="35" cy="18" r="5" fill="url(#goldShimmerMaking)"/>
    <circle cx="58" cy="13" r="3.5" fill="url(#goldShimmerMaking)"/>
    <!-- Center Red Kemp Stone Gem -->
    <g class="gemGroup">
      <circle cx="35" cy="18" r="3" fill="url(#rubyGlow)"/>
      <circle cx="34" cy="17" r="0.8" fill="#fff"/>
    </g>
  </g>

  <!-- Striking Sparks on Impact -->
  <g class="sparkCluster">
    <path d="M 140 115 L 128 100 M 140 115 L 142 92 M 140 115 L 158 102 M 140 115 L 122 118 M 140 115 L 155 120" stroke="#ffe28a" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="140" cy="115" r="4" fill="#fff" filter="url(#glowMaking)"/>
  </g>

  <!-- Goldsmith Handcrafting Hammer -->
  <g class="hammerGroup">
    <!-- Hammer Handle -->
    <rect x="175" y="45" width="10" height="60" rx="3" transform="rotate(-40 180 75)" fill="#c29b63" stroke="#7a5523" stroke-width="1.2"/>
    <!-- Hammer Head (Gold/Bronze) -->
    <rect x="128" y="70" width="34" height="18" rx="3" transform="rotate(-40 145 79)" fill="url(#goldShimmerMaking)" stroke="#ffe28a" stroke-width="1.5" filter="url(#glowMaking)"/>
    <!-- Metallic Impact Face -->
    <rect x="122" y="74" width="8" height="10" rx="1.5" transform="rotate(-40 126 79)" fill="#e5e5e5"/>
  </g>

  <!-- Floating Sparkles -->
  <g class="s1">
    <path d="M 50 45 Q 50 38 45 38 Q 50 38 50 31 Q 50 38 55 38 Q 50 38 50 45 Z" fill="#ffd700"/>
  </g>
  <g class="s2">
    <path d="M 275 50 Q 275 43 270 43 Q 275 43 275 36 Q 275 43 280 43 Q 275 43 275 50 Z" fill="#ffd700"/>
  </g>
  <g class="s3">
    <path d="M 260 145 Q 260 139 255 139 Q 260 139 260 133 Q 260 139 265 139 Q 260 139 260 145 Z" fill="#ff4b72"/>
  </g>
  <g class="s4">
    <path d="M 55 140 Q 55 134 50 134 Q 55 134 55 128 Q 55 134 60 134 Q 55 134 55 140 Z" fill="#ffe28a"/>
  </g>
</svg>
