<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a0812" />
      <stop offset="50%" stop-color="#19040a" />
      <stop offset="100%" stop-color="#0d0205" />
    </linearGradient>

    <!-- Gold Foil Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0be" />
      <stop offset="30%" stop-color="#d4af37" />
      <stop offset="70%" stop-color="#aa7c11" />
      <stop offset="100%" stop-color="#f3e5ab" />
    </linearGradient>

    <!-- Ruby Gem Gradient -->
    <radialGradient id="rubyGrad" cx="35%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#ff758c" />
      <stop offset="50%" stop-color="#c9184a" />
      <stop offset="100%" stop-color="#590d22" />
    </radialGradient>

    <!-- Pearl Luster Gradient -->
    <radialGradient id="pearlGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#fdfbf7" />
      <stop offset="100%" stop-color="#d9cfbf" />
    </radialGradient>

    <!-- Glowing Sparkle Filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes hammerTap {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(-24deg); }
        70% { transform: rotate(4deg); }
      }
      @keyframes sparklePulse {
        0%, 100% { transform: scale(0.3) rotate(0deg); opacity: 0.1; }
        50% { transform: scale(1.2) rotate(45deg); opacity: 1; filter: drop-shadow(0 0 6px #ffd700); }
      }
      @keyframes goldGleam {
        0% { stop-color: #d4af37; }
        50% { stop-color: #fff4d0; }
        100% { stop-color: #d4af37; }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-5px); }
      }
      @keyframes lightBeam {
        0%, 100% { opacity: 0.2; transform: scaleX(0.8); }
        50% { opacity: 0.6; transform: scaleX(1.1); }
      }
      .hammerGroup {
        transform-origin: 360px 110px;
        animation: hammerTap 2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .sparkle1 {
        transform-origin: 250px 170px;
        animation: sparklePulse 2.2s ease-in-out infinite;
      }
      .sparkle2 {
        transform-origin: 210px 140px;
        animation: sparklePulse 1.8s ease-in-out 0.6s infinite;
      }
      .sparkle3 {
        transform-origin: 290px 150px;
        animation: sparklePulse 2.5s ease-in-out 1.2s infinite;
      }
      .jewelPiece {
        animation: floatSlow 4s ease-in-out infinite;
      }
      .glowAura {
        animation: lightBeam 3s ease-in-out infinite;
        transform-origin: center;
      }
    </style>
  </defs>

  <!-- Ambient Backdrop -->
  <rect width="500" height="320" rx="16" fill="url(#bgGrad)" />

  <!-- Artisan Workbench / Anvil Table Surface -->
  <ellipse cx="250" cy="270" rx="200" ry="32" fill="#140207" opacity="0.8" />
  <path d="M 80,240 L 420,240 L 390,285 L 110,285 Z" fill="#20060d" stroke="#3d0f1c" stroke-width="1.5" />
  <line x1="80" y1="240" x2="420" y2="240" stroke="#d4af37" stroke-width="1" opacity="0.3" />

  <!-- Soft Golden Ambient Aura Behind Jewellery -->
  <circle cx="250" cy="165" r="90" fill="#d4af37" opacity="0.08" filter="url(#glow)" class="glowAura" />
  <circle cx="250" cy="165" r="55" fill="#c9184a" opacity="0.12" filter="url(#glow)" />

  <!-- Intricate Maharashtrian Traditional Jewellery Piece Being Crafted (Thushi / Choker) -->
  <g class="jewelPiece">
    <!-- Outer Golden Arch/Filigree -->
    <path d="M 170,165 C 170,225 330,225 330,165 C 330,185 170,185 170,165 Z" fill="url(#goldGrad)" stroke="#785303" stroke-width="1.5" />

    <!-- Ornate Gold Beads & Pearls String -->
    <g fill="url(#goldGrad)" stroke="#573c02" stroke-width="0.8">
      <circle cx="170" cy="165" r="7" />
      <circle cx="185" cy="177" r="7.5" />
      <circle cx="203" cy="187" r="8" />
      <circle cx="225" cy="193" r="8.5" />
      <circle cx="250" cy="195" r="9.5" />
      <circle cx="275" cy="193" r="8.5" />
      <circle cx="297" cy="187" r="8" />
      <circle cx="315" cy="177" r="7.5" />
      <circle cx="330" cy="165" r="7" />
    </g>

    <!-- Pearl Droplets Hanging from Beads -->
    <g fill="url(#pearlGrad)" stroke="#b8a892" stroke-width="0.5">
      <circle cx="185" cy="195" r="4.5" />
      <circle cx="203" cy="207" r="5" />
      <circle cx="225" cy="215" r="5.5" />
      <circle cx="250" cy="220" r="6.5" />
      <circle cx="275" cy="215" r="5.5" />
      <circle cx="297" cy="207" r="5" />
      <circle cx="315" cy="195" r="4.5" />
    </g>

    <!-- Center Royal Pendant (Kundan / Kempu Red Motif) -->
    <g transform="translate(250, 160)">
      <!-- Gold Petal Rim -->
      <path d="M 0,-24 L 7,-8 L 24,-7 L 11,5 L 15,22 L 0,12 L -15,22 L -11,5 L -24,-7 L -7,-8 Z" fill="url(#goldGrad)" stroke="#573c02" stroke-width="1" />
      <!-- Center Ruby Stone -->
      <polygon points="0,-15 12,-4 8,12 -8,12 -12,-4" fill="url(#rubyGrad)" stroke="#fff0be" stroke-width="0.7" />
      <!-- Facet Sparkle Accent -->
      <polygon points="0,-15 4,-4 0,3 -4,-4" fill="#ffffff" opacity="0.6" />
    </g>

    <!-- Side Traditional Kempu Stones -->
    <circle cx="210" cy="160" r="6" fill="url(#rubyGrad)" stroke="url(#goldGrad)" stroke-width="1.2" />
    <circle cx="290" cy="160" r="6" fill="url(#rubyGrad)" stroke="url(#goldGrad)" stroke-width="1.2" />
  </g>

  <!-- Precision Goldsmith Tools (Pliers / Forceps resting & Hammer working) -->
  <!-- Tweezers / Gem Setter Tool Holding an Emerald/Ruby bead -->
  <g transform="translate(145, 125) rotate(-20)">
    <path d="M 0,0 L 45,35 L 50,38 L 48,32 L 8,-3 Z" fill="#9e9e9e" stroke="#424242" stroke-width="0.8" />
    <path d="M 0,8 L 45,37 L 50,38 L 48,34 L 8,5 Z" fill="#cfcfcf" stroke="#424242" stroke-width="0.8" />
  </g>

  <!-- Goldsmith Handcrafting Mallet / Chasing Hammer in Motion -->
  <g class="hammerGroup">
    <!-- Rosewood Handle -->
    <path d="M 355,100 L 440,30 C 445,26 450,32 446,36 L 365,110 Z" fill="#8d4925" stroke="#4a210b" stroke-width="1" />
    <!-- Brass / Steel Chasing Head -->
    <path d="M 345,95 L 375,118 L 365,130 L 335,107 Z" fill="url(#goldGrad)" stroke="#4a3000" stroke-width="1.2" />
    <!-- Ball Peen Dome Tip -->
    <path d="M 335,107 C 327,113 322,122 328,127 C 334,132 343,127 348,120 Z" fill="#cfd8dc" stroke="#546e7a" stroke-width="0.8" />
  </g>

  <!-- Dynamic Glitter & Micro Sparkles -->
  <g class="sparkle1">
    <path d="M 250,155 Q 250,170 235,170 Q 250,170 250,185 Q 250,170 265,170 Q 250,170 250,155 Z" fill="#fff9db" />
  </g>
  <g class="sparkle2">
    <path d="M 210,130 Q 210,140 200,140 Q 210,140 210,150 Q 210,140 220,140 Q 210,140 210,130 Z" fill="#ffd700" />
  </g>
  <g class="sparkle3">
    <path d="M 290,140 Q 290,150 280,150 Q 290,150 290,160 Q 290,150 300,150 Q 290,150 290,140 Z" fill="#fff" />
  </g>

  <!-- Bottom Crafting Status Caption Overlay inside SVG for fallback -->
  <g transform="translate(250, 298)">
    <text text-anchor="middle" fill="#d4af37" font-family="'Playfair Display', Georgia, serif" font-size="13" font-weight="700" letter-spacing="2">
      HANDCRAFTING IN PROGRESS
    </text>
  </g>
</svg>
